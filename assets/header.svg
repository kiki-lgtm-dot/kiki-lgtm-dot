<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="280" viewBox="0 0 1200 280" role="img" aria-label="Hi, I'm kiki">
  <defs>
    <linearGradient id="base" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eaf3ff"/>
      <stop offset="0.5" stop-color="#f7f6ff"/>
      <stop offset="1" stop-color="#fdf0fb"/>
    </linearGradient>
    <radialGradient id="g-sky" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#a6c9ff" stop-opacity="0.6"/>
      <stop offset="1" stop-color="#a6c9ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-blue" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#5c9dfb" stop-opacity="0.5"/>
      <stop offset="1" stop-color="#5c9dfb" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-purple" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#8661c5" stop-opacity="0.36"/>
      <stop offset="1" stop-color="#8661c5" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="g-pink" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#f6a7ec" stop-opacity="0.42"/>
      <stop offset="1" stop-color="#f6a7ec" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1200" height="280" fill="url(#base)"/>

  <!-- soft diffuse blobs -->
  <ellipse cx="120" cy="40" rx="300" ry="210" fill="url(#g-sky)"/>
  <ellipse cx="1080" cy="30" rx="280" ry="200" fill="url(#g-blue)"/>
  <ellipse cx="400" cy="290" rx="340" ry="210" fill="url(#g-purple)"/>
  <ellipse cx="900" cy="300" rx="320" ry="200" fill="url(#g-pink)"/>

  <!-- title -->
  <text x="600" y="150" text-anchor="middle" font-family="Segoe UI, -apple-system, Helvetica, Arial, sans-serif" font-size="52" font-weight="700" fill="#1f1f3a">Hi, I'm kiki 👋</text>
</svg>
